version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: telebase-postgres
    environment:
      POSTGRES_USER: telebase
      POSTGRES_PASSWORD: telebasepassword
      POSTGRES_DB: telebase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: telebase-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
